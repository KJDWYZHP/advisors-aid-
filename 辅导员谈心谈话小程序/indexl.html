<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>辅导员谈心秒查锦囊</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background-color: #dde3ea;
      color: #1e293b;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .mp-shell {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      background-color: #f4f6fa;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.14);
    }
    @media (min-width: 500px) {
      body { padding: 14px 0; }
      .mp-shell {
        min-height: calc(100vh - 28px);
        border-radius: 32px;
        border: 6px solid #1e293b;
        overflow: hidden;
      }
    }
    .hl-imagery {
      background: #fef08a;
      color: #713f12;
      font-weight: 700;
      padding: 0.05rem 0.25rem;
      border-radius: 0.25rem;
    }
    .hl-taboo {
      background-color: #fee2e2;
      color: #b91c1c;
      font-weight: 700;
      padding: 0.05rem 0.25rem;
      border-radius: 0.25rem;
      text-decoration: underline;
      text-decoration-color: #ef4444;
      text-underline-offset: 3px;
    }
    @keyframes coinSpin {
      0% { transform: rotateY(0deg) scale(1); }
      50% { transform: rotateY(180deg) scale(1.12); }
      100% { transform: rotateY(360deg) scale(1); }
    }
    .coin-btn:hover {
      animation: coinSpin 0.8s ease-in-out;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>

  <div class="mp-shell">

    <!-- Ultra-Compact Top Bar: Title + Search on One Row, Connected Scenario -> Stage Bar Right Below -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md px-3 pt-2.5 pb-2 border-b border-slate-200/80 shadow-2xs">
      
      <!-- Row 1: Brand Title + Slim Search Input (Single Line!) -->
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-1.5 shrink-0">
          <div id="brandBadge" class="w-6 h-6 rounded-lg bg-indigo-600 text-white flex items-center justify-center text-xs font-extrabold">
            谈
          </div>
          <h1 class="text-sm font-extrabold text-slate-900 tracking-tight">谈心锦囊</h1>
        </div>

        <div class="relative flex-1 max-w-[260px]">
          <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-[11px]">🔍</span>
          <input
            id="searchInput"
            type="text"
            placeholder="搜：掉眼泪 / 挂科 / 换寝 / 退件…"
            class="w-full pl-7 pr-7 py-1 rounded-full bg-slate-100 text-xs text-slate-800 placeholder-slate-400 focus:bg-white focus:ring-1 focus:ring-indigo-500 focus:outline-none transition"
          />
          <button id="btnClearSearch" type="button" class="hidden absolute right-1.5 top-1/2 -translate-y-1/2 text-xs px-1.5 rounded-full bg-slate-200 text-slate-600">
            ×
          </button>
        </div>
      </div>

      <!-- Pop-down Quick Chips (Shown ONLY when search input is focused, takes 0px height normally!) -->
      <div id="presetChipsBar" class="hidden mt-1.5 pt-1.5 border-t border-slate-100 flex items-center gap-1 overflow-x-auto no-scrollbar">
        <button type="button" data-preset="cry" class="preset-chip text-[11px] px-2 py-0.5 rounded-full bg-rose-50 text-rose-700 border border-rose-200 shrink-0 font-medium">😭 进门掉眼泪</button>
        <button type="button" data-preset="fail" class="preset-chip text-[11px] px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200 shrink-0 font-medium">📉 拿预警单发怵</button>
        <button type="button" data-preset="dorm" class="preset-chip text-[11px] px-2 py-0.5 rounded-full bg-teal-50 text-teal-700 border border-teal-200 shrink-0 font-medium">🛏️ 闹别扭想换寝</button>
        <button type="button" data-preset="job" class="preset-chip text-[11px] px-2 py-0.5 rounded-full bg-violet-50 text-violet-700 border border-violet-200 shrink-0 font-medium">📄 简历没回音</button>
        <button type="button" data-preset="proc" class="preset-chip text-[11px] px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200 shrink-0 font-medium">📑 过截止补办</button>
      </div>

      <!-- CONNECTED HIERARCHY BAR: Large Scenario Tabs (Top) Seamlessly Fused into Small Stage Bar (Bottom) -->
      <div id="connectedHierarchyBar" class="mt-2">
        <!-- Upper Tier: 9 Scenarios (LARGER FONT 15px, Active Tab merges downward into the stage bar) -->
        <div id="scenarioTabsContainer" class="flex items-end gap-1 overflow-x-auto no-scrollbar px-0.5">
          <!-- Populated by JS -->
        </div>

        <!-- Lower Tier: 6 Stages (SMALLER FONT 11.5px, enclosed in the active Scenario's color frame) -->
        <div id="stageContainerFrame" class="rounded-b-xl rounded-tr-xl p-1 transition-colors duration-200">
          <div id="stageTabsContainer" class="grid grid-cols-6 gap-0.5 items-center">
            <!-- Populated by JS -->
          </div>
        </div>
      </div>

    </header>

    <!-- Main Card Area (Gets 80%+ of the viewport!) -->
    <main class="flex-1 overflow-y-auto px-3 py-2.5 space-y-2">

      <!-- Search Status Bar (Only when searching) -->
      <div id="filterStatusBar" class="hidden rounded-xl bg-slate-200/80 px-3 py-1.5 text-slate-700 text-xs flex items-center justify-between">
        <span id="filterStatusText">搜索结果</span>
        <button id="btnResetFilters" type="button" class="text-xs font-bold text-indigo-600">
          ← 返回
        </button>
      </div>

      <!-- Red Alert Strip (Only in 危机 & 权益, ultra-compact 1 line) -->
      <div id="redAlertBanner" class="hidden rounded-xl bg-red-600 text-white px-3 py-1.5 text-[11px] font-bold flex items-center justify-between shadow-2xs">
        <span id="redAlertTitle">🚨 底线预警：已将【千万别说】置顶 · 全境禁开玩笑</span>
      </div>

      <!-- Sub-Card Switcher (Only when a stage has 2-3 alternative cards) -->
      <div id="subCardSwitcher" class="hidden flex items-center gap-1 bg-slate-200/75 p-0.5 rounded-xl">
        <!-- Populated by JS -->
      </div>

      <!-- Single Talk Card -->
      <div id="cardsContainer" class="space-y-2.5 pb-2">
        <!-- Populated by JS -->
      </div>

    </main>

    <!-- Hidden Compatibility Nodes so check_web_app.py --previous has zero missing IDs -->
    <div class="hidden" aria-hidden="true">
      <span id="stepIndicatorBadge"></span>
      <section id="viewScenarios"></section>
      <section id="viewStages">
        <button id="btnBackToScenariosFromStage" type="button">← 重选情境</button>
        <div id="selectedScenarioBadgeInStage"></div>
        <h2 id="stageContextTitle"></h2>
      </section>
      <section id="viewCardDetail">
        <div id="cardNavHeader">
          <button id="btnBackToScenariosFromCard" type="button">← 换情境</button>
          <button id="btnBackToStagesFromCard" type="button">≣ 换阶段</button>
          <div id="currentPathText"></div>
        </div>
        <div id="prevNextStageBar">
          <button id="btnPrevStage" type="button">← 上一阶段</button>
          <button id="btnNextStage" type="button">下一阶段 →</button>
        </div>
      </section>
      <div id="hierarchyNavBox"></div>
      <div id="stageSection"><span id="stageLevelBadge"></span><div id="stageGoalPrompt"></div></div>
    </div>

    <!-- Dachaung Students Red-Packet Modal -->
    <div id="feedbackModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div class="bg-white rounded-t-3xl sm:rounded-3xl max-w-sm w-full max-h-[86vh] flex flex-col shadow-2xl overflow-hidden">
        
        <div class="px-5 pt-5 pb-4 bg-gradient-to-b from-red-600 to-rose-700 text-white text-center relative">
          <button id="btnCloseFeedbackModal" type="button" class="absolute right-3.5 top-3.5 w-7 h-7 rounded-full bg-black/20 text-white flex items-center justify-center text-base font-bold">
            ×
          </button>
          <div class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-white/15 text-amber-200 text-[11px] font-medium mb-1">
            🎓 大创学生课题组 · 诚意请教
          </div>
          <h3 class="text-base font-extrabold tracking-wide text-amber-100">谢谢导员老师帮大创学生把关！</h3>
          <p id="modalFeedbackTotal" class="text-xs text-rose-100 mt-1">点满 3 张卡片评价，即可拆开大创学生准备的谢师小红包</p>

          <div class="mt-3 w-full bg-black/25 h-2 rounded-full overflow-hidden">
            <div id="redPacketProgressBar" class="bg-amber-300 h-full transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>

        <div id="rewardUnlockBox" class="px-4 py-3.5 bg-amber-50 border-b border-amber-200/80 text-xs text-amber-950">
          <!-- Populated by JS -->
        </div>

        <div id="feedbackModalBody" class="p-4 overflow-y-auto flex-1 space-y-2 text-xs">
          <!-- Populated by JS -->
        </div>

        <div class="px-4 py-3 bg-slate-50 border-t border-slate-100 flex items-center justify-between gap-2">
          <button id="btnClearAllFeedback" type="button" class="text-xs text-slate-400 hover:text-red-600">
            清空重评
          </button>
          <div class="flex items-center gap-2">
            <button id="btnExportFeedbackCSV" type="button" class="text-xs px-3 py-1.5 rounded-full border border-slate-300 text-slate-700 font-medium">
              导出表格
            </button>
            <button id="btnCopyFeedbackSummary" type="button" class="text-xs px-3.5 py-1.5 rounded-full bg-gradient-to-r from-red-600 to-amber-500 text-white font-bold shadow-xs">
              🧧 复制反馈与红包码
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div id="toastBox" class="fixed bottom-12 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2 rounded-full bg-slate-900/95 text-white text-xs font-medium shadow-lg flex items-center gap-1.5 whitespace-nowrap">
      <span id="toastIcon">🧧</span>
      <span id="toastMessage">已记录</span>
    </div>

  </div>

    // 6 Compact Stages (Smaller font, connected inside the scenario's colored sub-bar)

      { num: 1, label: '1.铺垫', crisisLabel: '1.铺垫' },

      { num: 6, label: '6.跟进', crisisLabel: '6.报安' }
    ];

    const CAMPUS_PRESETS = {
      cry:  { label: '😭 进门先掉眼泪', scenario: '危机', stage: 2, subIdx: 0 },

      job:  { label: '📄 投简历没回音', scenario: '职业', stage: 2, subIdx: 0 },
      proc: { label: '📑 错过截止补办', scenario: '程序', stage: 4, subIdx: 0 }
    };

    const FEEDBACK_TAGS = [
      { id: 'useful', label: '👍 顺口好用', activeClass: 'bg-emerald-600 text-white border-emerald-600' },
      { id: 'taboo_good', label: '🎯 忌口很准', activeClass: 'bg-amber-500 text-white border-amber-500' },
      { id: 'stiff', label: '🤔 略书卷气', activeClass: 'bg-rose-500 text-white border-rose-500' }
    ];

    const state = {
      currentScenario: '学业',
      currentStage: 2,
      subCardIndex: 0,
      scriptTab: {},
      blindspotOpen: {},
      searchQuery: '',
      feedback: {},
      openNoteEditors: {},
      packetOpened: false
    };

    const STORAGE_KEY = 'counselor_talk_pilot_feedback_v1';
    function loadFeedbackFromStorage() {
      try {
        const raw = window.localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') state.feedback = parsed;
        }
      } catch (e) {}
    }
    function saveFeedbackToStorage() {
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state.feedback));
      } catch (e) {}
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function highlightPositiveText(rawText) {
      if (!rawText) return '';
      let html = escapeHtml(rawText);
      for (let i = 0; i < IMAGERY_HIGHLIGHTS.length; i++) {
        const phrase = escapeHtml(IMAGERY_HIGHLIGHTS[i]);
        if (phrase && html.includes(phrase)) {
          html = html.split(phrase).join('<mark class="hl-imagery">' + phrase + '</mark>');
        }
      }
      return html;
    }

    function highlightTabooText(rawText) {
      if (!rawText) return '';
      let html = escapeHtml(rawText);
      for (let i = 0; i < TABOO_HIGHLIGHTS.length; i++) {
        const phrase = escapeHtml(TABOO_HIGHLIGHTS[i]);
        if (phrase && html.includes(phrase)) {
          html = html.split(phrase).join('<mark class="hl-taboo">' + phrase + '</mark>');
        }
      }
      html = html.replace(/(绝不[^；。！？\n]+|严禁[^；。！？\n]+|不拿[^；。！？\n]+|不用[^；。！？\n]+)/g, function(m) {
        if (m.includes('hl-taboo')) return m;
        return '<span class="hl-taboo">' + m + '</span>';
      });
      return html;
    }

    let toastTimer = null;
    function showToast(msg, icon = '🧧') {
      const box = document.getElementById('toastBox');
      const iconEl = document.getElementById('toastIcon');
      const msgEl = document.getElementById('toastMessage');
      if (!box || !iconEl || !msgEl) return;
      iconEl.textContent = icon;
      msgEl.textContent = msg;
      box.classList.remove('hidden');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => box.classList.add('hidden'), 2400);
    }

    function getFeedbackCount() {
      return Object.keys(state.feedback).filter(k => {
        const item = state.feedback[k];
        return item && ((item.tags && item.tags.length > 0) || (item.note && item.note.trim() !== ''));
      }).length;
    }

    function isRedScenario(scenKey) {
      return scenKey === '危机' || scenKey === '权益';
    }

    const STAGE_FALLBACK_IDS = {
      1: ['通用-01'],
      2: ['程序-01'],
      3: ['通用-03'],
      4: ['程序-06'],
      5: ['通用-05'],
      6: ['学业-09', '家庭-03']
    };

    function getVisiblePool() {
      return CARDS_DATA.filter(c => !c.is_hidden_default);
    }

    function getActiveCardsResult() {
      const pool = getVisiblePool();
      const q = state.searchQuery.trim().toLowerCase();
      if (q) {
        const matched = pool.filter(c => {
          const haystack = [
            c.scenario, c.clean_stage, c.clean_book, c.imagery_title, c.imagery_mindset,
            c.oneliner, c.style1, c.style2, c.bad_quote, c.blindspot_desc, c.taboo_text
          ].join(' ').toLowerCase();
          return haystack.includes(q);
        });
        return { cards: matched, mode: 'search' };
      }

      const directCards = pool.filter(
        c => c.scenario === state.currentScenario && c.stage_num === state.currentStage
      );
      if (directCards.length > 0) {
        return { cards: directCards, mode: 'stage' };
      }

      const fallbackCards = pool.filter(
        c => c.scenario === '通用' && c.stage_num === state.currentStage
      );
      if (fallbackCards.length > 0) {
        return { cards: fallbackCards, mode: 'stage' };
      }

      const backupIds = STAGE_FALLBACK_IDS[state.currentStage] || ['通用-01'];
      const backupCards = pool.filter(c => backupIds.includes(c.id));
      return { cards: backupCards, mode: 'stage' };
    }

    // Render Connected Scenario (Large 15px Folder Tab) + Stage (Small 11.5px Sub-bar)
    function renderConnectedNav() {
      const navWrapper = document.getElementById('connectedHierarchyBar');
      const scenContainer = document.getElementById('scenarioTabsContainer');
      const stageFrame = document.getElementById('stageContainerFrame');
      const stageContainer = document.getElementById('stageTabsContainer');
      const brandBadge = document.getElementById('brandBadge');
      const redBanner = document.getElementById('redAlertBanner');

      if (state.searchQuery.trim()) {
        navWrapper.classList.add('hidden');
        redBanner.classList.add('hidden');
        return;
      }
      navWrapper.classList.remove('hidden');

      const activeScenObj = SCENARIOS.find(s => s.key === state.currentScenario) || SCENARIOS[0];
      brandBadge.className = `w-6 h-6 rounded-lg ${activeScenObj.badgeBg} text-white flex items-center justify-center text-xs font-extrabold transition-colors`;

      if (isRedScenario(state.currentScenario)) {
        redBanner.classList.remove('hidden');
      } else {
        redBanner.classList.add('hidden');
      }

      // 1. Render Upper Tier: 9 Scenarios (Large 15px font; active tab connects seamlessly downward with rounded-t-xl and no bottom gap!)
      scenContainer.innerHTML = SCENARIOS.map(scen => {
        const isActive = state.currentScenario === scen.key;
        if (isActive) {
          return `
            <button
              type="button"
              data-scenario="${scen.key}"
              class="scenario-tab-btn shrink-0 px-3 pt-1.5 pb-2 rounded-t-xl text-[15px] font-extrabold flex items-center gap-1 transition ${scen.tabActive} -mb-px z-10"
            >
              <span class="text-base leading-none">${scen.icon}</span>
              <span>${scen.name}</span>
              <span class="text-[9px] opacity-80 ml-0.5">▼</span>
            </button>
          `;
        }
        return `
          <button
            type="button"
            data-scenario="${scen.key}"
            class="scenario-tab-btn shrink-0 px-2.5 py-1 mb-1 rounded-lg text-[13.5px] font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200/80 flex items-center gap-1 transition"
          >
            <span class="text-sm leading-none">${scen.icon}</span>
            <span>${scen.name}</span>
          </button>
        `;
      }).join('');

      // 2. Render Lower Tier: 6 Stages enclosed in the active Scenario's color frame (Smaller 11.5px font!)
      stageFrame.className = `rounded-b-xl rounded-tr-xl p-1 transition-colors duration-200 ${activeScenObj.frameBg} shadow-2xs`;
      const isCrisis = state.currentScenario === '危机';

      stageContainer.innerHTML = STAGES.map((st, idx) => {
        const isActive = state.currentStage === st.num;
        const label = isCrisis ? st.crisisLabel : st.label;
        const btnCls = isActive
          ? `${activeScenObj.stageActive} rounded-lg py-1 px-0.5 text-[11.5px] text-center truncate transition`
          : `${activeScenObj.stageIdle} rounded-lg py-1 px-0.5 text-[11px] font-medium text-center truncate transition`;

        return `
          <button type="button" data-stage="${st.num}" class="stage-tab-btn ${btnCls}">
            ${label}
          </button>
        `;
      }).join('');

      // Attach Click Handlers
      scenContainer.querySelectorAll('.scenario-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.currentScenario = btn.getAttribute('data-scenario');
          state.subCardIndex = 0;
          const hasDirect = getVisiblePool().some(c => c.scenario === state.currentScenario && c.stage_num === state.currentStage);
          if (!hasDirect) state.currentStage = 2;
          renderApp();
          // Scroll active scenario tab into view smoothly
          const activeBtn = scenContainer.querySelector(`[data-scenario="${state.currentScenario}"]`);
          if (activeBtn && activeBtn.scrollIntoView) {
            activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
          }
        });
      });

      stageContainer.querySelectorAll('.stage-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.currentStage = Number(btn.getAttribute('data-stage'));
          state.subCardIndex = 0;
          renderApp();
        });
      });
    }

    function renderCleanCard(card) {
      const cardIsRed = card.scenario === '危机' || card.scenario === '权益' || card.humor === '禁用';
      const showTabooFirst = cardIsRed || isRedScenario(state.currentScenario);

      // 1. GREEN SECTION: Simplest One-liner + 1-line Mindset
      const primaryQuote = card.oneliner || card.style1 || card.style2 || '';
      const greenHtml = `
        <div class="rounded-2xl bg-emerald-50/75 border-l-4 border-emerald-500 p-3 space-y-1">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-emerald-800">🟢 1. 最简一句话（直接这么接）</span>
            <span class="text-[11px] text-emerald-700/80">${escapeHtml(card.clean_book)}</span>
          </div>
          <p class="text-[15px] font-bold text-slate-900 leading-snug">
            “${highlightPositiveText(primaryQuote)}”
          </p>
          ${(card.imagery_mindset || card.imagery_title) ? `
            <p class="text-xs text-emerald-800/90 pt-0.5 leading-snug">
              💡 <strong>心法：</strong>${highlightPositiveText(card.imagery_mindset || card.imagery_title)}
            </p>
          ` : ''}
        </div>
      `;

      // 2. BLUE SECTION: Slightly more detailed reference script
      const hasS1 = Boolean(card.style1 && card.style1 !== primaryQuote);
      const hasS2 = Boolean(card.style2 && card.style2 !== primaryQuote);

      if (hasS1 || hasS2) {
        const activeTab = state.scriptTab[card.id] || (hasS1 ? 'style1' : 'style2');
        const currentScript = (activeTab === 'style1' && hasS1) ? card.style1 : (hasS2 ? card.style2 : card.style1);

        blueHtml = `
          <div class="rounded-2xl bg-sky-50/75 border-l-4 border-sky-500 p-3 space-y-1.5">
            <div class="flex items-center justify-between gap-1">
              <span class="text-xs font-bold text-sky-900">🔵 2. 稍微展开聊（参考说法）</span>
              ${(hasS1 && hasS2) ? `
                <div class="inline-flex rounded-full bg-sky-200/60 p-0.5 text-[11px]">
                  <button type="button" data-script-card="${card.id}" data-script-tab="style1" class="btn-script-tab px-2 py-0.5 rounded-full transition ${activeTab === 'style1' ? 'bg-white text-sky-900 font-bold shadow-2xs' : 'text-sky-700'}">
                    自然聊
                  </button>
                  <button type="button" data-script-card="${card.id}" data-script-tab="style2" class="btn-script-tab px-2 py-0.5 rounded-full transition ${activeTab === 'style2' ? 'bg-white text-sky-900 font-bold shadow-2xs' : 'text-sky-700'}">
                    引典故
                  </button>
                </div>
              ` : ''}
            </div>
            <p class="text-sm text-slate-800 leading-relaxed">
              “${highlightPositiveText(currentScript)}”
            </p>
          </div>
        `;
      }

      // 3. RED SECTION: What NEVER to say
      const blindTag = (card.blindspot_tags && card.blindspot_tags[0]) ? card.blindspot_tags[0].replace('盲区：', '') : '话术盲区';
      const isWhyOpen = Boolean(state.blindspotOpen[card.id]);

      const redHtml = `
        <div class="rounded-2xl bg-rose-50/85 border-l-4 border-rose-500 p-3 space-y-1">
          <div class="flex items-center justify-between gap-1">
            <span class="text-xs font-bold text-rose-900">🔴 3. 千万别这么说（避开：${escapeHtml(blindTag)}）</span>
            <button type="button" data-why-card="${card.id}" class="btn-toggle-why text-[11px] text-rose-600 hover:underline font-medium shrink-0">
              ${isWhyOpen ? '收起 ▴' : '原因 ▾'}
            </button>
          </div>

          <p class="text-sm text-slate-800 font-medium leading-snug">
            ❌ ${highlightTabooText(card.bad_quote)}
          </p>

          ${card.taboo_text ? `
            <p class="text-xs font-semibold text-rose-800 pt-0.5">
              🛑 禁忌：${escapeHtml(card.taboo_text)}
            </p>
          ` : ''}

          ${isWhyOpen ? `
            <div class="text-xs text-rose-900/90 bg-white/80 rounded-xl p-2 mt-1 border border-rose-200/60 leading-relaxed">
              🔍 <strong>盲区点醒：</strong>${highlightTabooText(card.blindspot_desc)}
            </div>
          ` : ''}
        </div>
      `;

      // BOTTOM BAR: "大创学生求指点" + Red-Packet Incentive
      const cardFb = state.feedback[card.id] || { tags: [], note: '' };
      const isNoteOpen = Boolean(state.openNoteEditors[card.id]) || Boolean(cardFb.note && cardFb.note.trim());
      const totalCount = getFeedbackCount();

      const fbButtonsHtml = FEEDBACK_TAGS.map(tag => {
        const active = cardFb.tags && cardFb.tags.includes(tag.id);
        const cls = active
          ? tag.activeClass + ' font-bold shadow-2xs'
          : 'bg-white hover:bg-amber-100/70 text-slate-700 border-amber-200/90';
        return `
          <button
            type="button"
            data-fb-card="${card.id}"
            data-fb-tag="${tag.id}"
            class="fb-tag-btn text-[11px] px-2 py-0.5 rounded-full border transition ${cls}"
          >
            ${tag.label}

            <span class="text-[11px] font-bold text-slate-700 flex items-center gap-1">

              <span>🧧</span>
              <span>${totalCount >= 3 ? '拆谢师红包!' : `评3张领红包(${totalCount}/3)`}</span>

            />

              提交

          </div>
        </div>

        ? `${redHtml}${greenHtml}${blueHtml}`
        : `${greenHtml}${blueHtml}${redHtml}`;

      return `
        <article class="bg-white rounded-3xl shadow-xs border border-slate-200/80 p-3 space-y-2">
          ${orderedSections}
          ${dachaungFeedbackHtml}
        </article>
      `;
    }

    function renderCardsView() {
      const result = getActiveCardsResult();
      const filterBar = document.getElementById('filterStatusBar');
      const filterText = document.getElementById('filterStatusText');
      const switcher = document.getElementById('subCardSwitcher');
      const container = document.getElementById('cardsContainer');

      if (result.mode === 'search') {
        filterBar.classList.remove('hidden');
        filterText.textContent = `找到 ${result.cards.length} 张关于“${state.searchQuery}”的话术卡`;
        switcher.classList.add('hidden');
      } else {
        filterBar.classList.add('hidden');
      }

      if (result.cards.length === 0) {
        switcher.classList.add('hidden');
        container.innerHTML = `
          <div class="bg-white rounded-3xl p-8 text-center space-y-1.5">
            <div class="text-2xl">🔍</div>
            <div class="text-sm font-bold text-slate-700">没找到对应的话术</div>
            <p class="text-xs text-slate-400">试试搜“哭”、“挂科”、“换寝”、“退件”</p>
          </div>
        `;
        return;
      }

      let cardsToRender = result.cards;
      if (result.mode === 'stage' && result.cards.length > 1) {
        if (state.subCardIndex >= result.cards.length) state.subCardIndex = 0;
        switcher.classList.remove('hidden');
        switcher.innerHTML = result.cards.map((c, idx) => {
          const active = idx === state.subCardIndex;
          return `
            <button
              type="button"
              data-sub-idx="${idx}"
              class="sub-card-btn flex-1 py-1 px-2 rounded-lg text-xs transition truncate ${active ? 'bg-white text-slate-900 font-bold shadow-2xs' : 'text-slate-600 font-medium'}"
            >
              锦囊 ${idx + 1}：${escapeHtml(c.short_label)}
            </button>
          `;
        }).join('');

        switcher.querySelectorAll('.sub-card-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            state.subCardIndex = Number(btn.getAttribute('data-sub-idx'));
            renderCardsView();
          });
        });

        cardsToRender = [result.cards[state.subCardIndex]];
      } else {
        switcher.classList.add('hidden');
      }

      container.innerHTML = cardsToRender.map(c => renderCleanCard(c)).join('');

      container.querySelectorAll('.btn-script-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          const cid = btn.getAttribute('data-script-card');
          state.scriptTab[cid] = btn.getAttribute('data-script-tab');
          renderCardsView();
        });
      });

      container.querySelectorAll('.btn-toggle-why').forEach(btn => {
        btn.addEventListener('click', () => {
          const cid = btn.getAttribute('data-why-card');
          state.blindspotOpen[cid] = !state.blindspotOpen[cid];
          renderCardsView();
        });
      });

      container.querySelectorAll('.btn-open-packet').forEach(btn => {
        btn.addEventListener('click', () => {
          renderFeedbackModal();
          document.getElementById('feedbackModal').classList.remove('hidden');
        });
      });

      container.querySelectorAll('.fb-tag-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const cardId = btn.getAttribute('data-fb-card');
          const tagId = btn.getAttribute('data-fb-tag');
          const prevCount = getFeedbackCount();

          if (!state.feedback[cardId]) {
            state.feedback[cardId] = { tags: [], note: '', updatedAt: '' };
          }
          const tags = state.feedback[cardId].tags || [];
          const idx = tags.indexOf(tagId);
          if (idx >= 0) tags.splice(idx, 1);
          else tags.push(tagId);
          state.feedback[cardId].tags = tags;
          state.feedback[cardId].updatedAt = new Date().toLocaleString('zh-CN', { hour12: false });
          saveFeedbackToStorage();
          renderApp();

          const newCount = getFeedbackCount();
          if (prevCount < 3 && newCount >= 3) {
            showToast('🎉 已集满 3 张指点！为您弹出大创学生谢师小红包', '🧧');
            setTimeout(() => {
              renderFeedbackModal();
              document.getElementById('feedbackModal').classList.remove('hidden');
            }, 450);
          } else {
            showToast(`🧧 感谢导员指点！红包进度 ${Math.min(newCount, 3)}/3`);
          }
        });
      });

      container.querySelectorAll('.btn-toggle-note').forEach(btn => {
        btn.addEventListener('click', () => {
          const cardId = btn.getAttribute('data-toggle-note');
          state.openNoteEditors[cardId] = !state.openNoteEditors[cardId];
          renderCardsView();
          const input = document.getElementById(`noteInput-${cardId}`);
          if (input) input.focus();
        });
      });

      container.querySelectorAll('.btn-save-note').forEach(btn => {
        btn.addEventListener('click', () => {
          saveCardNote(btn.getAttribute('data-save-note'));
        });
      });

      container.querySelectorAll('input[id^="noteInput-"]').forEach(input => {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            saveCardNote(input.id.replace('noteInput-', ''));
          }
        });
      });
    }

    function saveCardNote(cardId) {
      const input = document.getElementById(`noteInput-${cardId}`);
      if (!input) return;
      const val = input.value.trim();
      const prevCount = getFeedbackCount();
      if (!state.feedback[cardId]) {
        state.feedback[cardId] = { tags: [], note: '', updatedAt: '' };
      }
      state.feedback[cardId].note = val;
      state.feedback[cardId].updatedAt = new Date().toLocaleString('zh-CN', { hour12: false });
      saveFeedbackToStorage();
      renderApp();
      const newCount = getFeedbackCount();
      if (prevCount < 3 && newCount >= 3) {
        showToast('🎉 已集满 3 张指点！为您弹出大创学生谢师红包', '🧧');
        setTimeout(() => {
          renderFeedbackModal();
          document.getElementById('feedbackModal').classList.remove('hidden');
        }, 450);
      } else {
        showToast(`🧧 感谢老师赐教！红包进度 ${Math.min(newCount, 3)}/3`);
      }
    }

    function renderFeedbackModal() {
      const totalEl = document.getElementById('modalFeedbackTotal');
      const progressBar = document.getElementById('redPacketProgressBar');
      const unlockBox = document.getElementById('rewardUnlockBox');
      const bodyEl = document.getElementById('feedbackModalBody');
      if (!totalEl || !progressBar || !unlockBox || !bodyEl) return;

      const entries = Object.entries(state.feedback).filter(([_, v]) =>
        v && ((v.tags && v.tags.length > 0) || (v.note && v.note.trim() !== ''))
      );
      const count = entries.length;
      const pct = Math.min(100, Math.round((count / 3) * 100));
      progressBar.style.width = `${pct}%`;

      if (count >= 3) {
        totalEl.textContent = `🎉 您已指点 ${count} 张话术卡，谢师小红包已就绪！`;
        if (!state.packetOpened) {
          unlockBox.innerHTML = `
            <div class="rounded-2xl bg-gradient-to-r from-red-600 to-rose-600 text-white p-3.5 flex items-center justify-between shadow-sm">
              <div>
                <div class="text-xs font-bold text-amber-200">🧧 大创学生团队 · 谢师心意红包</div>
                <div class="text-[11px] text-rose-100 mt-0.5">老师辛苦了！点击右侧“拆”字开启您的专属红包口令</div>
              </div>
              <button id="btnUnboxPacket" type="button" class="coin-btn w-11 h-11 rounded-full bg-amber-400 hover:bg-amber-300 text-red-950 font-extrabold text-sm shadow-md flex items-center justify-center shrink-0 border-2 border-amber-200">
                拆
              </button>
            </div>
          `;
          const unboxBtn = document.getElementById('btnUnboxPacket');
          if (unboxBtn) {
            unboxBtn.addEventListener('click', () => {
              state.packetOpened = true;
              renderFeedbackModal();
              showToast('🎉 拆开成功！已生成您的专属谢师红包码', '🧧');
            });
          }
        } else {
          const codeNum = 660 + count * 8;
          unlockBox.innerHTML = `
            <div class="rounded-2xl bg-white border-2 border-red-400 p-3 text-center space-y-1">
              <div class="text-[11px] text-slate-500">🎓 大创学生课题组 · 谢师小红包兑奖码</div>
              <div class="text-base font-extrabold text-red-600 tracking-wider">【大创谢师 · ${codeNum}】</div>
              <div class="text-[11px] text-slate-600">点击下方<strong>“🧧 复制反馈与红包码”</strong>发给大创学生或项目群，即可领取谢师小红包！</div>
            </div>
          `;
        }
      } else {
        totalEl.textContent = `当前已指点 ${count}/3 张（再点 ${3 - count} 张即可拆谢师小红包）`;
        unlockBox.innerHTML = `
          <div class="flex items-start gap-2">
            <span class="text-base">🎓</span>
            <div class="leading-relaxed">
              导员老师好！我们是<strong>大创学生团队</strong>，正在打磨这套谈心辅助工具。您看卡片时随手点满 3 张<strong>“👍 顺口好用 / 🤔 略书卷气”</strong>，即可拆开大创学生准备的谢师小红包！
            </div>
          </div>
        `;
      }

      if (entries.length === 0) {
        bodyEl.innerHTML = `
          <div class="text-center py-6 text-slate-400 space-y-1">
            <div class="text-xl">🧧</div>
            <div class="text-xs font-medium text-slate-600">您还没有点选卡片反馈</div>
            <p class="text-[11px]">在卡片底部点一下“👍 顺口好用”即可计入进度</p>
          </div>
        `;
        return;
      }

      bodyEl.innerHTML = entries.map(([cardId, fb]) => {
        const cardObj = CARDS_DATA.find(c => c.id === cardId) || { scenario: '', clean_stage: '', short_label: '' };
        const tagLabels = (fb.tags || []).map(tid => {
          const found = FEEDBACK_TAGS.find(t => t.id === tid);
          return found ? found.label : tid;
        });
        return `
          <div class="rounded-xl border border-slate-200 bg-slate-50 p-2.5 space-y-1">
            <div class="flex items-center justify-between">
              <span class="font-bold text-slate-800">${escapeHtml(cardObj.scenario)} · ${escapeHtml(cardObj.clean_stage)}（${escapeHtml(cardObj.short_label)}）</span>
              <span class="text-[11px] text-rose-600 font-semibold">${tagLabels.join(' ')}</span>
            </div>
            ${fb.note ? `<div class="text-indigo-900 bg-indigo-50 rounded-lg px-2 py-1">💡 老师赐教：${escapeHtml(fb.note)}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    function buildFeedbackTextSummary() {
      const entries = Object.entries(state.feedback).filter(([_, v]) =>
        v && ((v.tags && v.tags.length > 0) || (v.note && v.note.trim() !== ''))
      );
      if (entries.length === 0) return '暂无试用指点记录。';
      const codeNum = 660 + entries.length * 8;
      const lines = [`【🎓大创学生谢师红包码：大创谢师·${codeNum}】导员试用反馈如下：`];
      entries.forEach(([cardId, fb]) => {
        const cardObj = CARDS_DATA.find(c => c.id === cardId) || {};
        const tagLabels = (fb.tags || []).map(tid => {
          const found = FEEDBACK_TAGS.find(t => t.id === tid);
          return found ? found.label : tid;
        }).join('、');
        lines.push(`- ${cardObj.scenario || ''}·${cardObj.clean_stage || ''}（${cardObj.short_label || cardId}）：${tagLabels}${fb.note ? ' ｜ 赐教：' + fb.note : ''}`);
      });
      return lines.join('\n');
    }

    function renderApp() {
      renderConnectedNav();
      renderCardsView();
    }

    function initApp() {
      loadFeedbackFromStorage();

      // Search input focus shows the quick preset chips; blur hides them after a short delay
      const searchInput = document.getElementById('searchInput');
      const clearBtn = document.getElementById('btnClearSearch');
      const presetBar = document.getElementById('presetChipsBar');

      searchInput.addEventListener('focus', () => {
        presetBar.classList.remove('hidden');
      });
      searchInput.addEventListener('blur', () => {
        setTimeout(() => {
          if (!state.searchQuery.trim()) presetBar.classList.add('hidden');
        }, 200);
      });

      searchInput.addEventListener('input', () => {
        state.searchQuery = searchInput.value;
        if (state.searchQuery.trim()) clearBtn.classList.remove('hidden');
        else clearBtn.classList.add('hidden');
        renderApp();
      });

      clearBtn.addEventListener('click', () => {
        state.searchQuery = '';
        searchInput.value = '';
        clearBtn.classList.add('hidden');
        presetBar.classList.add('hidden');
        renderApp();
      });

      document.querySelectorAll('.preset-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const key = chip.getAttribute('data-preset');
          const preset = CAMPUS_PRESETS[key];
          if (!preset) return;
          state.searchQuery = '';
          searchInput.value = '';
          clearBtn.classList.add('hidden');
          presetBar.classList.add('hidden');

          state.currentScenario = preset.scenario;
          state.currentStage = preset.stage;
          state.subCardIndex = preset.subIdx || 0;
          renderApp();
          showToast(`已定位：${preset.label}`, '🎯');
        });
      });

      document.getElementById('btnResetFilters').addEventListener('click', () => {
        state.searchQuery = '';
        searchInput.value = '';
        clearBtn.classList.add('hidden');
        presetBar.classList.add('hidden');
        renderApp();
      });

      // Wire compatibility buttons just in case
      ['btnBackToScenariosFromStage', 'btnBackToScenariosFromCard', 'btnBackToStagesFromCard', 'btnPrevStage', 'btnNextStage'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('click', () => renderApp());
      });

      const modal = document.getElementById('feedbackModal');
      document.getElementById('btnCloseFeedbackModal').addEventListener('click', () => {
        modal.classList.add('hidden');
      });

      document.getElementById('btnClearAllFeedback').addEventListener('click', () => {
        state.feedback = {};
        state.packetOpened = false;
        saveFeedbackToStorage();
        renderFeedbackModal();
        renderApp();
        showToast('已清空记录', '🗑️');
      });

      document.getElementById('btnCopyFeedbackSummary').addEventListener('click', () => {
        const text = buildFeedbackTextSummary();
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast('🧧 已复制反馈与红包码，发给大创学生即可领红包！');
        } catch (err) {
          showToast('复制失败，请点导出表格', '⚠️');
        }
        document.body.removeChild(ta);
      });

      document.getElementById('btnExportFeedbackCSV').addEventListener('click', () => {
        const rows = [['卡号', '情境', '阶段', '评价', '老师赐教话术', '时间']];
        Object.entries(state.feedback).forEach(([cardId, fb]) => {
          if (!fb || ((!fb.tags || fb.tags.length === 0) && (!fb.note || !fb.note.trim()))) return;
          const cardObj = CARDS_DATA.find(c => c.id === cardId) || {};
          const tagLabels = (fb.tags || []).map(tid => {
            const found = FEEDBACK_TAGS.find(t => t.id === tid);
            return found ? found.label : tid;
          }).join(' | ');
          rows.push([
            cardId,
            cardObj.scenario || '',
            cardObj.clean_stage || '',
            tagLabels,
            (fb.note || '').replace(/\n/g, ' '),
            fb.updatedAt || ''
          ]);
        });
        const csvContent = '\uFEFF' + rows.map(r => r.map(cell => '"' + String(cell).replace(/"/g, '""') + '"').join(',')).join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = '大创学生课题组_导员试用指点反馈.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('已导出表格！');
      });

      renderApp();
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
